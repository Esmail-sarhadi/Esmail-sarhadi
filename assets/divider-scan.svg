<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 48" width="1200" height="48" role="img" aria-label="scanline divider">
  <defs>
    <linearGradient id="scG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#7CFFB2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7CFFB2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scBeam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes scRun  { from{transform:translateY(-6px)} to{transform:translateY(48px)} }
    @keyframes scDash { to { stroke-dashoffset: -240; } }
    @keyframes scTick { 0%,49%{opacity:1} 50%,100%{opacity:.2} }
    .scRun { animation: scRun 3.2s linear infinite; }
    .scDash { stroke-dasharray: 4 20; animation: scDash 3s linear infinite; }
    .scTick { animation: scTick 1.4s steps(1,end) infinite; }
    .mono { font-family: Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
    @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
  </style>

  <rect width="1200" height="48" fill="#050810"/>

  <!-- dashed rail -->
  <line x1="0" y1="24" x2="1200" y2="24" stroke="#14304F" stroke-width="1.2"/>
  <line x1="0" y1="24" x2="1200" y2="24" stroke="url(#scG)" stroke-width="1.4"/>
  <line x1="0" y1="24" x2="1200" y2="24" stroke="#7CFFB2" stroke-width="2.2" class="scDash" opacity="0.5"/>

  <!-- moving scan beam -->
  <rect class="scRun" x="0" y="0" width="1200" height="6" fill="url(#scBeam)" opacity="0.55"/>

  <!-- ticks -->
  <g stroke="#1E4A78" stroke-width="1.2">
    <path d="M120 18 V30"/><path d="M300 18 V30"/><path d="M480 18 V30"/>
    <path d="M660 18 V30"/><path d="M840 18 V30"/><path d="M1020 18 V30"/>
  </g>

  <!-- centre marker -->
  <rect x="578" y="17" width="44" height="14" rx="2" fill="#07182B" stroke="#2A6FA8" stroke-width="1.2"/>
  <circle class="scTick" cx="600" cy="24" r="2.4" fill="#7CFFB2"/>
  <text class="mono" x="546" y="28" text-anchor="end" fill="#2F5F8C" font-size="8" letter-spacing="1.5">SCAN</text>
  <text class="mono" x="654" y="28" fill="#2F5F8C" font-size="8" letter-spacing="1.5">SYNC</text>

  <g stroke="#1E4A78" stroke-width="1.4" fill="none">
    <path d="M0 12 V24"/><path d="M0 36 V24"/><path d="M1200 12 V24"/><path d="M1200 36 V24"/>
  </g>
</svg>
