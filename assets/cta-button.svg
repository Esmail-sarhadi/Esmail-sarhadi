<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Call to action — start a project">
  <defs>
    <linearGradient id="cbg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050810"/><stop offset="100%" stop-color="#03050A"/>
    </linearGradient>
    <linearGradient id="cborder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7CFFB2"/>
      <stop offset="100%" stop-color="#B388FF"/>
    </linearGradient>
    <linearGradient id="csweep2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="cdots2" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#16304F" opacity="0.5"/>
    </pattern>
    <filter id="cglow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
    .sans { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    @keyframes cblink2 { 0%,45%{opacity:1} 55%,95%{opacity:.15} 100%{opacity:1} }
    @keyframes csweep2 { from{transform:translateX(-200px)} to{transform:translateX(1200px)} }
    @keyframes cnudge  { 0%,100%{transform:translateX(0)} 50%{transform:translateX(7px)} }
    @keyframes cring   { 0%{opacity:.5} 100%{opacity:0} }
    .cblink2 { animation: cblink2 2s steps(1,end) infinite; }
    .csweep2 { animation: csweep2 4.5s linear infinite; }
    .cnudge  { animation: cnudge 1.8s ease-in-out infinite; }
    @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
  </style>

  <rect width="1200" height="200" fill="url(#cbg2)"/>
  <rect width="1200" height="200" fill="url(#cdots2)"/>

  <!-- panel -->
  <rect x="24" y="18" width="1152" height="164" rx="10" fill="#061020" stroke="#14304F" stroke-width="1.4"/>
  <rect x="24" y="18" width="1152" height="3" rx="1.5" fill="url(#cborder)"/>
  <rect x="24" y="179" width="1152" height="3" rx="1.5" fill="url(#cborder)" opacity="0.6"/>

  <rect class="csweep2" x="0" y="18" width="200" height="164" fill="url(#csweep2)"/>

  <!-- status strip -->
  <circle class="cblink2" cx="52" cy="48" r="4" fill="#7CFFB2" filter="url(#cglow2)"/>
  <text class="mono" x="66" y="52" fill="#4E7CA8" font-size="10.5" letter-spacing="3">CHANNEL OPEN &#183; RESPONSE WITHIN 48 H</text>
  <text class="mono" x="1148" y="52" text-anchor="end" fill="#2F5F8C" font-size="10" letter-spacing="2">ZAHEDAN / REMOTE</text>
  <line x1="44" y1="66" x2="1156" y2="66" stroke="#122544" stroke-width="1"/>

  <!-- headline -->
  <text class="sans" x="600" y="112" text-anchor="middle" fill="#EAF6FF" font-size="29" font-weight="700" letter-spacing="1.2">
    HAVE A DEVICE THAT NEEDS TO START TALKING?
  </text>
  <text class="mono" x="600" y="140" text-anchor="middle" fill="#4E7CA8" font-size="12.5" letter-spacing="2">
    FIRMWARE &#183; MODBUS / RS-485 &#183; LoRa NETWORKS &#183; SCADA &#183; OPERATOR DASHBOARDS
  </text>

  <!-- button -->
  <g>
    <rect x="470" y="152" width="260" height="34" rx="17" fill="#08182A" stroke="#00E5FF" stroke-width="1.5"/>
    <text class="mono" x="576" y="174" text-anchor="middle" fill="#EAF6FF" font-size="13.5" letter-spacing="2.5">START A PROJECT</text>
    <g class="cnudge">
      <path d="M756 169 h14 m-6 -6 l6 6 l-6 6" fill="none" stroke="#7CFFB2" stroke-width="1.8"/>
    </g>
    <circle cx="486" cy="169" r="9" fill="none" stroke="#00E5FF" stroke-width="1.2">
      <animate attributeName="r" values="9;18" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g stroke="#2A6FA8" stroke-width="2" fill="none" opacity="0.85">
    <path d="M16 30 V16 H30"/><path d="M1184 30 V16 H1170"/>
    <path d="M16 170 V184 H30"/><path d="M1184 170 V184 H1170"/>
  </g>
</svg>
