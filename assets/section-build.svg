<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Section — what I actually build">
  <defs>
    <linearGradient id="hbus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#7CFFB2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7CFFB2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hdots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#16304F" opacity="0.5"/>
    </pattern>
    <filter id="hsoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
    @keyframes hblink { 0%,45%{opacity:1} 55%,95%{opacity:.2} 100%{opacity:1} }
    @keyframes hflow  { to { stroke-dashoffset: -600; } }
    @keyframes hbreathe { 0%,100%{opacity:.3} 50%{opacity:1} }
    .hblink { animation: hblink 2.2s steps(1,end) infinite; }
    .hflow { stroke-dasharray: 12 28; animation: hflow 5s linear infinite; }
    .hb1 { animation: hbreathe 2.8s ease-in-out infinite; }
    .hb2 { animation: hbreathe 2.8s ease-in-out infinite; animation-delay: .7s; }
    @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
  </style>

  <rect width="1200" height="150" fill="#050810"/>
  <rect width="1200" height="150" fill="url(#hdots)"/>
  <ellipse cx="900" cy="66" rx="310" ry="82" fill="url(#hglow)"/>

  <!-- header -->
  <circle class="hblink" cx="40" cy="34" r="4" fill="#7CFFB2" filter="url(#hsoft)"/>
  <text class="mono" x="56" y="39" fill="#4E7CA8" font-size="11" letter-spacing="3">SEC/01 // CAPABILITIES</text>
  <text class="mono" x="40" y="86" fill="#EAF6FF" font-size="30" font-weight="700" letter-spacing="3">WHAT I ACTUALLY BUILD</text>
  <text class="mono" x="40" y="112" fill="#4E7CA8" font-size="12" letter-spacing="2">// FIRMWARE · BRIDGES · LoRa NETWORKS · TELEMETRY · DASHBOARDS</text>
  <text class="mono" x="1160" y="20" text-anchor="end" fill="#2F5F8C" font-size="9" letter-spacing="2">FIG.01 // SIGNAL CHAIN</text>

  <!-- traces + pins -->
  <g stroke="#1E4A78" stroke-width="1.2" fill="none">
    <path d="M768 64 H800"/><path d="M858 64 H978"/>
    <path d="M702 58 H712 M702 70 H712 M758 58 H768 M758 70 H768"/>
    <path d="M815 38 V46 M829 38 V46 M843 38 V46 M815 82 V90 M829 82 V90 M843 82 V90"/>
  </g>

  <!-- sensor node -->
  <rect x="712" y="50" width="46" height="28" rx="3" fill="#07182B" stroke="#1E4A78" stroke-width="1.3"/>
  <text class="mono" x="735" y="68" text-anchor="middle" fill="#7FB2DC" font-size="9" letter-spacing="1">SNS</text>

  <!-- mcu node -->
  <rect x="800" y="46" width="58" height="36" rx="4" fill="#08182A" stroke="#2A6FA8" stroke-width="1.4"/>
  <circle cx="829" cy="52" r="2" fill="#2A6FA8"/>
  <text class="mono" x="829" y="70" text-anchor="middle" fill="#9CC4E4" font-size="9.5" letter-spacing="1">MCU</text>

  <!-- antenna -->
  <line x1="920" y1="64" x2="920" y2="30" stroke="#2A6FA8" stroke-width="2"/>
  <circle class="hblink" cx="920" cy="27" r="3.5" fill="#00E5FF" filter="url(#hsoft)"/>
  <path class="hb1" d="M905 33 Q920 15 935 33" fill="none" stroke="#7CFFB2" stroke-width="1.3"/>
  <path class="hb2" d="M895 30 Q920 4 945 30" fill="none" stroke="#7CFFB2" stroke-width="1.3"/>
  <text class="mono" x="950" y="34" fill="#2F5F8C" font-size="8" letter-spacing="1">LoRa</text>

  <!-- dashboard node -->
  <rect x="978" y="44" width="66" height="40" rx="4" fill="#061020" stroke="#2A6FA8" stroke-width="1.4"/>
  <path d="M986 70 996 60 1006 65 1016 52 1026 58 1036 50" fill="none" stroke="#7CFFB2" stroke-width="1.4"/>
  <line x1="984" y1="74" x2="1038" y2="74" stroke="#14304F" stroke-width="1.2"/>
  <path d="M1052 58 l10 6 -10 6" fill="none" stroke="#2A6FA8" stroke-width="1.6"/>

  <!-- data pulse -->
  <circle r="3" fill="#7CFFB2" filter="url(#hsoft)" opacity="0.95">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M712 64 H1046"/>
  </circle>

  <!-- labels -->
  <g class="mono" font-size="8.5" letter-spacing="1.5" fill="#2F5F8C" text-anchor="middle">
    <text x="735" y="99">SENSOR</text>
    <text x="829" y="99">MCU</text>
    <text x="1011" y="99">DASHBOARD</text>
  </g>

  <!-- bus -->
  <line x1="24" y1="132" x2="1176" y2="132" stroke="#14304F" stroke-width="1.2"/>
  <line x1="24" y1="132" x2="1176" y2="132" stroke="url(#hbus)" stroke-width="2" class="hflow" opacity="0.7"/>
  <g stroke="#1E4A78" stroke-width="1.4"><path d="M24 120 V132"/><path d="M1176 120 V132"/></g>

  <rect x="1" y="1" width="1198" height="148" rx="2" fill="none" stroke="#122544" stroke-width="2"/>
</svg>
