<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Illustration — electronics workbench with oscilloscope, ESP32 board and soldering iron">
  <defs>
    <linearGradient id="lwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060B14"/><stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <linearGradient id="ldesk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12202F"/><stop offset="100%" stop-color="#08121E"/>
    </linearGradient>
    <linearGradient id="lscope" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16283C"/><stop offset="100%" stop-color="#0B1725"/>
    </linearGradient>
    <linearGradient id="lscreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#031018"/><stop offset="100%" stop-color="#020A10"/>
    </linearGradient>
    <linearGradient id="lboard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123049"/><stop offset="100%" stop-color="#0A1D2E"/>
    </linearGradient>
    <radialGradient id="llamp" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ltiles" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0C1A29" stroke-width="1"/>
    </pattern>
    <clipPath id="lscopeClip"><rect x="86" y="132" width="164" height="92"/></clipPath>
    <filter id="lglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
    @keyframes lscroll { to { transform: translateX(-88px); } }
    @keyframes lled    { 0%,40%{opacity:1} 50%,92%{opacity:.15} 100%{opacity:1} }
    @keyframes lled2   { 0%,20%{opacity:.15} 30%,70%{opacity:1} 80%,100%{opacity:.15} }
    @keyframes lsmoke  { 0%{opacity:0; transform:translateY(0) scale(.7)} 25%{opacity:.45} 100%{opacity:0; transform:translateY(-52px) scale(1.25)} }
    @keyframes lspark  { 0%,88%{opacity:0} 92%{opacity:1} 96%{opacity:.2} 100%{opacity:0} }
    @keyframes lsweep  { from{transform:translateY(0)} to{transform:translateY(92px)} }
    .lscroll { animation: lscroll 1.6s linear infinite; }
    .lled { animation: lled 1.4s steps(1,end) infinite; }
    .lled2 { animation: lled2 1.9s steps(1,end) infinite; }
    .lsmoke { animation: lsmoke 3.4s ease-out infinite; }
    .ls1 { animation: lsmoke 3.4s ease-out infinite; }
    .ls2 { animation: lsmoke 3.4s ease-out infinite; animation-delay: 1.1s; }
    .ls3 { animation: lsmoke 3.4s ease-out infinite; animation-delay: 2.2s; }
    .lspark { animation: lspark 2.6s steps(1,end) infinite; }
    .lsweep { animation: lsweep 4s linear infinite; }
    @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
  </style>

  <!-- room -->
  <rect width="1200" height="400" fill="url(#lwall)"/>
  <rect width="1200" height="290" fill="url(#ltiles)" opacity="0.6"/>
  <ellipse cx="600" cy="60" rx="520" ry="200" fill="url(#llamp)"/>

  <!-- shelf -->
  <line x1="40" y1="74" x2="1160" y2="74" stroke="#1A2E44" stroke-width="3"/>
  <line x1="40" y1="78" x2="1160" y2="78" stroke="#0A1626" stroke-width="1"/>
  <g>
    <rect x="80" y="42" width="52" height="32" rx="2" fill="#0C1B2A" stroke="#1E3A55"/>
    <rect x="140" y="42" width="52" height="32" rx="2" fill="#0C1B2A" stroke="#1E3A55"/>
    <rect x="200" y="42" width="52" height="32" rx="2" fill="#0C1B2A" stroke="#1E3A55"/>
    <text class="mono" x="92" y="62" fill="#2F5F8C" font-size="8">R</text>
    <text class="mono" x="152" y="62" fill="#2F5F8C" font-size="8">C</text>
    <text class="mono" x="212" y="62" fill="#2F5F8C" font-size="8">IC</text>
    <!-- component reels -->
    <g>
      <circle cx="1050" cy="58" r="22" fill="#0C1B2A" stroke="#1E3A55" stroke-width="1.4"/>
      <circle cx="1050" cy="58" r="7" fill="#081420"/>
      <circle cx="1104" cy="58" r="18" fill="#0C1B2A" stroke="#1E3A55" stroke-width="1.4"/>
      <circle cx="1104" cy="58" r="6" fill="#081420"/>
    </g>
  </g>

  <!-- ================= OSCILLOSCOPE ================= -->
  <g>
    <rect x="60" y="112" width="216" height="168" rx="8" fill="url(#lscope)" stroke="#24486B" stroke-width="1.6"/>
    <rect x="76" y="126" width="184" height="104" rx="4" fill="#0A1522" stroke="#1B3550" stroke-width="1.2"/>
    <!-- screen -->
    <rect x="86" y="132" width="164" height="92" fill="url(#lscreen)"/>
    <g stroke="#0B2135" stroke-width="1">
      <path d="M108 132 V224 M130 132 V224 M152 132 V224 M174 132 V224 M196 132 V224 M218 132 V224"/>
      <path d="M86 155 H250 M86 178 H250 M86 201 H250"/>
    </g>
    <line x1="86" y1="178" x2="250" y2="178" stroke="#144063" stroke-width="1"/>
    <!-- waveform -->
    <g clip-path="url(#lscopeClip)">
      <g class="lscroll">
        <path d="M-4 178 l10 0 l6 -34 l8 68 l8 -52 l10 18 l10 0 l6 -24 l8 48 l8 -40 l10 16 l10 0 l6 -30 l8 60 l8 -46 l10 22 l10 0 l6 -28 l8 56 l8 -44 l10 18 l10 0 l6 -22 l8 44 l8 -36 l10 14 l10 0 l6 -26 l8 52 l8 -42 l10 18 l10 0"
             fill="none" stroke="#00E5FF" stroke-width="1.8"/>
      </g>
      <g class="lscroll" style="animation-duration:2.4s">
        <path d="M-4 206 h14 v-16 h20 v16 h14 v-16 h20 v16 h14 v-16 h20 v16 h14 v-16 h20 v16 h14 v-16 h20 v16 h14 v-16 h20 v16 h14 v-16 h20 v16"
              fill="none" stroke="#7CFFB2" stroke-width="1.4" opacity="0.8"/>
      </g>
      <rect class="lsweep" x="86" y="132" width="164" height="3" fill="#00E5FF" opacity="0.10"/>
    </g>
    <!-- readouts -->
    <g class="mono" font-size="8" fill="#3E7CA8">
      <text x="94" y="145">CH1 2V/div</text>
      <text x="94" y="156">CH2 5V/div</text>
      <text x="196" y="145">TRIG</text>
    </g>
    <circle class="lled" cx="238" cy="142" r="2.4" fill="#7CFFB2"/>
    <!-- knobs -->
    <g fill="#0F2135" stroke="#2A6FA8" stroke-width="1.3">
      <circle cx="92" cy="256" r="10"/><circle cx="124" cy="256" r="10"/>
      <circle cx="156" cy="256" r="10"/><circle cx="188" cy="256" r="10"/>
    </g>
    <g stroke="#3E8FBF" stroke-width="1.4">
      <path d="M92 249 V256"/><path d="M124 252 L124 259"/><path d="M156 249 V256"/><path d="M188 250 L188 257"/>
    </g>
    <!-- probes -->
    <path d="M244 168 q26 22 44 10" fill="none" stroke="#1E4A78" stroke-width="1.6"/>
    <circle cx="292" cy="176" r="3" fill="#2A6FA8"/>
  </g>

  <!-- ================= DESK ================= -->
  <rect x="0" y="282" width="1200" height="118" fill="url(#ldesk)"/>
  <line x1="0" y1="282" x2="1200" y2="282" stroke="#22405C" stroke-width="1.6"/>
  <line x1="0" y1="286" x2="1200" y2="286" stroke="#0C1928" stroke-width="1"/>

  <!-- ============ ESP32 BOARD ============ -->
  <g transform="translate(316,232)">
    <rect x="0" y="0" width="150" height="54" rx="3" fill="url(#lboard)" stroke="#2A6FA8" stroke-width="1.5"/>
    <!-- pin headers -->
    <g fill="#0A1A28" stroke="#2A6FA8" stroke-width="1">
      <rect x="6" y="4" width="138" height="7" rx="1"/>
      <rect x="6" y="43" width="138" height="7" rx="1"/>
    </g>
    <g fill="#2A6FA8">
      <rect x="10" y="5" width="3" height="5"/><rect x="17" y="5" width="3" height="5"/>
      <rect x="24" y="5" width="3" height="5"/><rect x="31" y="5" width="3" height="5"/>
      <rect x="38" y="5" width="3" height="5"/><rect x="45" y="5" width="3" height="5"/>
      <rect x="52" y="5" width="3" height="5"/><rect x="59" y="5" width="3" height="5"/>
      <rect x="66" y="5" width="3" height="5"/><rect x="73" y="5" width="3" height="5"/>
      <rect x="80" y="5" width="3" height="5"/><rect x="87" y="5" width="3" height="5"/>
      <rect x="94" y="5" width="3" height="5"/><rect x="101" y="5" width="3" height="5"/>
      <rect x="108" y="5" width="3" height="5"/><rect x="115" y="5" width="3" height="5"/>
      <rect x="122" y="5" width="3" height="5"/><rect x="129" y="5" width="3" height="5"/>
      <rect x="136" y="5" width="3" height="5"/>
      <rect x="10" y="44" width="3" height="5"/><rect x="17" y="44" width="3" height="5"/>
      <rect x="24" y="44" width="3" height="5"/><rect x="31" y="44" width="3" height="5"/>
      <rect x="38" y="44" width="3" height="5"/><rect x="45" y="44" width="3" height="5"/>
      <rect x="52" y="44" width="3" height="5"/><rect x="59" y="44" width="3" height="5"/>
      <rect x="66" y="44" width="3" height="5"/><rect x="73" y="44" width="3" height="5"/>
      <rect x="80" y="44" width="3" height="5"/><rect x="87" y="44" width="3" height="5"/>
      <rect x="94" y="44" width="3" height="5"/><rect x="101" y="44" width="3" height="5"/>
      <rect x="108" y="44" width="3" height="5"/><rect x="115" y="44" width="3" height="5"/>
      <rect x="122" y="44" width="3" height="5"/><rect x="129" y="44" width="3" height="5"/>
      <rect x="136" y="44" width="3" height="5"/>
    </g>
    <!-- module shield -->
    <rect x="26" y="17" width="58" height="22" rx="2" fill="#0A1D2E" stroke="#3E8FBF" stroke-width="1.2"/>
    <text class="mono" x="55" y="32" text-anchor="middle" fill="#7FB2DC" font-size="8.5">ESP32</text>
    <!-- usb -->
    <rect x="98" y="20" width="26" height="16" rx="2" fill="#0B1725" stroke="#4A6E8C" stroke-width="1.2"/>
    <rect x="102" y="24" width="18" height="8" rx="1" fill="#050C14"/>
    <!-- leds -->
    <circle class="lled" cx="14" cy="28" r="3" fill="#7CFFB2" filter="url(#lglow)"/>
    <circle class="lled2" cx="14" cy="38" r="3" fill="#00E5FF" filter="url(#lglow)"/>
    <!-- antenna trace -->
    <path d="M92 12 h10 v-6" fill="none" stroke="#2A6FA8" stroke-width="1"/>
  </g>

  <!-- ============ BREADBOARD + SENSOR ============ -->
  <g transform="translate(486,236)">
    <rect x="0" y="0" width="196" height="46" rx="3" fill="#0E1F30" stroke="#24486B" stroke-width="1.3"/>
    <!-- hole grid -->
    <g fill="#060F19">
      <circle cx="16" cy="14" r="2"/><circle cx="30" cy="14" r="2"/><circle cx="44" cy="14" r="2"/>
      <circle cx="58" cy="14" r="2"/><circle cx="72" cy="14" r="2"/><circle cx="86" cy="14" r="2"/>
      <circle cx="100" cy="14" r="2"/><circle cx="114" cy="14" r="2"/><circle cx="128" cy="14" r="2"/>
      <circle cx="142" cy="14" r="2"/><circle cx="156" cy="14" r="2"/><circle cx="170" cy="14" r="2"/>
      <circle cx="184" cy="14" r="2"/>
      <circle cx="16" cy="32" r="2"/><circle cx="30" cy="32" r="2"/><circle cx="44" cy="32" r="2"/>
      <circle cx="58" cy="32" r="2"/><circle cx="72" cy="32" r="2"/><circle cx="86" cy="32" r="2"/>
      <circle cx="100" cy="32" r="2"/><circle cx="114" cy="32" r="2"/><circle cx="128" cy="32" r="2"/>
      <circle cx="142" cy="32" r="2"/><circle cx="156" cy="32" r="2"/><circle cx="170" cy="32" r="2"/>
      <circle cx="184" cy="32" r="2"/>
    </g>
    <!-- jumper wires -->
    <path d="M16 14 q34 -26 72 -6" fill="none" stroke="#FF6B9D" stroke-width="2.4"/>
    <path d="M44 14 q30 -30 66 -10" fill="none" stroke="#FFB86C" stroke-width="2.4"/>
    <path d="M86 32 q40 22 84 2" fill="none" stroke="#7CFFB2" stroke-width="2.4"/>
    <path d="M128 14 q26 -24 56 -4" fill="none" stroke="#00E5FF" stroke-width="2.4"/>
  </g>

  <!-- sensor module -->
  <g transform="translate(706,242)">
    <rect x="0" y="0" width="72" height="34" rx="3" fill="#0C1B2A" stroke="#24486B" stroke-width="1.3"/>
    <circle cx="20" cy="17" r="9" fill="#0A1522" stroke="#3E8FBF" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="3" fill="#7CFFB2" opacity="0.7"/>
    <text class="mono" x="38" y="15" fill="#7FB2DC" font-size="8">DHT21</text>
    <text class="mono" x="38" y="27" fill="#2F5F8C" font-size="7.5">MQ135</text>
  </g>

  <!-- ============ MULTIMETER ============ -->
  <g transform="translate(812,150)">
    <rect x="0" y="0" width="118" height="132" rx="7" fill="#12202F" stroke="#2A6FA8" stroke-width="1.5"/>
    <rect x="12" y="12" width="94" height="42" rx="3" fill="#04141A" stroke="#1B3550" stroke-width="1.2"/>
    <text class="mono" x="92" y="42" text-anchor="end" fill="#7CFFB2" font-size="24" font-weight="700">24.6</text>
    <text class="mono" x="20" y="42" fill="#2F5F8C" font-size="8">DC V</text>
    <circle cx="116" cy="12" r="12" fill="#0C1B2A" stroke="#2A6FA8" stroke-width="1.3"/>
    <path d="M116 6 V18" stroke="#3E8FBF" stroke-width="1.4"/>
    <g fill="#0C1B2A" stroke="#2A6FA8" stroke-width="1.2">
      <rect x="14" y="66" width="26" height="16" rx="2"/>
      <rect x="46" y="66" width="26" height="16" rx="2"/>
      <rect x="78" y="66" width="26" height="16" rx="2"/>
      <rect x="14" y="90" width="26" height="16" rx="2"/>
      <rect x="46" y="90" width="26" height="16" rx="2"/>
      <rect x="78" y="90" width="26" height="16" rx="2"/>
    </g>
    <!-- probes -->
    <path d="M112 112 q40 26 74 14" fill="none" stroke="#1E4A78" stroke-width="2"/>
    <circle cx="190" cy="128" r="3.2" fill="#2A6FA8"/>
    <path d="M112 120 q34 40 62 34" fill="none" stroke="#1E4A78" stroke-width="2"/>
    <circle cx="178" cy="156" r="3.2" fill="#2A6FA8"/>
  </g>

  <!-- ============ SOLDERING IRON ============ -->
  <g>
    <!-- stand -->
    <rect x="1002" y="252" width="86" height="10" rx="3" fill="#0F2135" stroke="#2A6FA8" stroke-width="1.2"/>
    <path d="M1010 252 q10 -22 20 0" fill="none" stroke="#2A6FA8" stroke-width="1.6"/>
    <!-- iron -->
    <g transform="rotate(-28 1050 250)">
      <rect x="1004" y="196" width="96" height="17" rx="7" fill="#16283C" stroke="#2A6FA8" stroke-width="1.4"/>
      <rect x="1092" y="199" width="34" height="11" rx="4" fill="#0C1B2A" stroke="#3E8FBF" stroke-width="1.2"/>
      <rect x="1122" y="201" width="16" height="7" rx="2" fill="#3A2A18" stroke="#8A6520" stroke-width="1"/>
      <rect x="988" y="197" width="22" height="15" rx="4" fill="#0F2135" stroke="#2A6FA8" stroke-width="1.2"/>
      <line x1="962" y1="204" x2="988" y2="204" stroke="#1E4A78" stroke-width="2.4"/>
    </g>
    <!-- tip heat -->
    <circle class="lspark" cx="1128" cy="238" r="3.4" fill="#FFB86C" filter="url(#lglow)"/>
    <circle class="lled" cx="1128" cy="238" r="1.6" fill="#FF6B9D"/>
    <!-- smoke -->
    <g fill="none" stroke="#4E7CA8" stroke-width="1.4" stroke-linecap="round">
      <path class="ls1" d="M1128 232 q-8 -14 4 -24" opacity="0"/>
      <path class="ls2" d="M1128 232 q10 -12 -2 -26" opacity="0"/>
      <path class="ls3" d="M1128 232 q-4 -16 8 -28" opacity="0"/>
    </g>
  </g>

  <!-- mug -->
  <g>
    <rect x="262" y="308" width="34" height="40" rx="4" fill="#0F2135" stroke="#2A6FA8" stroke-width="1.3"/>
    <path d="M296 318 q12 6 0 18" fill="none" stroke="#2A6FA8" stroke-width="1.6"/>
    <g fill="none" stroke="#4E7CA8" stroke-width="1.3" opacity="0.5">
      <path class="ls2" d="M270 306 q-8 -14 4 -22" opacity="0"/>
      <path class="ls3" d="M286 306 q8 -12 -2 -22" opacity="0"/>
    </g>
  </g>

  <!-- caption -->
  <text class="mono" x="600" y="366" text-anchor="middle" fill="#2F5F8C" font-size="10" letter-spacing="2.6">THE PART OF THE JOB THAT DOES NOT SHOW UP IN A COMMIT GRAPH</text>

  <g stroke="#2A6FA8" stroke-width="2" fill="none" opacity="0.85">
    <path d="M16 30 V16 H30"/><path d="M1184 30 V16 H1170"/>
    <path d="M16 370 V384 H30"/><path d="M1184 370 V384 H1170"/>
  </g>
</svg>
