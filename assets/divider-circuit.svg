<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40" role="img" aria-label="PCB trace divider">
  <defs>
    <linearGradient id="pcbG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="18%" stop-color="#00E5FF" stop-opacity="0.85"/>
      <stop offset="82%" stop-color="#7CFFB2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7CFFB2" stop-opacity="0"/>
    </linearGradient>
    <filter id="pcbGlow" x="-60%" y="-200%" width="220%" height="500%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pcbFlow { to { stroke-dashoffset: -520; } }
    @keyframes pcbBlink { 0%,49%{opacity:1} 50%,100%{opacity:.25} }
    .pcbFlow { stroke-dasharray: 16 34; animation: pcbFlow 5s linear infinite; }
    .pcbBlink { animation: pcbBlink 1.6s steps(1,end) infinite; }
    .mono { font-family: Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
    @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
  </style>

  <rect width="1200" height="40" fill="#050810"/>

  <!-- traces with 45-degree jogs -->
  <g fill="none" stroke="#14304F" stroke-width="1.3">
    <path d="M0 14 H180 L196 30 H470 L486 14 H714 L730 30 H1004 L1020 14 H1200"/>
    <path d="M0 26 H120 L136 10 H404 L420 26 H694 L710 10 H984 L1000 26 H1200"/>
  </g>
  <g fill="none" stroke="url(#pcbG)" stroke-width="1.3" class="pcbFlow">
    <path d="M0 14 H180 L196 30 H470 L486 14 H714 L730 30 H1004 L1020 14 H1200"/>
    <path d="M0 26 H120 L136 10 H404 L420 26 H694 L710 10 H984 L1000 26 H1200"/>
  </g>

  <!-- vias -->
  <g fill="#050810" stroke="#2A6FA8" stroke-width="1.2">
    <circle cx="180" cy="14" r="3"/><circle cx="470" cy="30" r="3"/>
    <circle cx="714" cy="14" r="3"/><circle cx="1004" cy="30" r="3"/>
    <circle cx="136" cy="10" r="3"/><circle cx="694" cy="26" r="3"/>
  </g>

  <!-- travelling pulses -->
  <g filter="url(#pcbGlow)">
    <circle r="2.4" fill="#00E5FF">
      <animateMotion dur="5.5s" repeatCount="indefinite" path="M0 14 H180 L196 30 H470 L486 14 H714 L730 30 H1004 L1020 14 H1200"/>
    </circle>
    <circle r="2.2" fill="#7CFFB2">
      <animateMotion dur="7s" begin="1.2s" repeatCount="indefinite" path="M0 26 H120 L136 10 H404 L420 26 H694 L710 10 H984 L1000 26 H1200"/>
    </circle>
  </g>

  <!-- centre connector -->
  <g>
    <rect x="556" y="8" width="88" height="24" rx="3" fill="#07182B" stroke="#2A6FA8" stroke-width="1.3"/>
    <g stroke="#2A6FA8" stroke-width="1.2">
      <path d="M566 8 V14 M578 8 V14 M590 8 V14 M602 8 V14 M614 8 V14 M626 8 V14 M638 8 V14"/>
      <path d="M566 32 V26 M578 32 V26 M590 32 V26 M602 32 V26 M614 32 V26 M626 32 V26 M638 32 V26"/>
    </g>
    <circle class="pcbBlink" cx="600" cy="20" r="2.4" fill="#7CFFB2"/>
    <text class="mono" x="524" y="24" text-anchor="end" fill="#2F5F8C" font-size="8" letter-spacing="1.5">J1</text>
    <text class="mono" x="676" y="24" fill="#2F5F8C" font-size="8" letter-spacing="1.5">BUS</text>
  </g>
</svg>
