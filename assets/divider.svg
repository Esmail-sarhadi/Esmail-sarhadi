<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 44" width="1200" height="44" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="dline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00E5FF" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="#7CFFB2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7CFFB2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dflow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7CFFB2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="dglow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes flow { to { stroke-dashoffset: -600; } }
    @keyframes pulse { 0%,100%{opacity:.25} 50%{opacity:1} }
    .flow { stroke-dasharray: 14 26; animation: flow 6s linear infinite; }
    .blip { animation: pulse 2.6s ease-in-out infinite; }
    .mono { font-family: Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
  </style>

  <rect width="1200" height="44" fill="#050810"/>

  <!-- rails -->
  <line x1="0" y1="22" x2="1200" y2="22" stroke="#122544" stroke-width="1.2"/>
  <line x1="0" y1="22" x2="1200" y2="22" stroke="url(#dline)" stroke-width="1.6"/>
  <line x1="0" y1="22" x2="1200" y2="22" stroke="url(#dflow)" stroke-width="2.6" class="flow" opacity="0.75"/>

  <!-- left node -->
  <g filter="url(#dglow)">
    <rect x="586" y="14" width="28" height="16" rx="3" fill="#07182B" stroke="#2A6FA8" stroke-width="1.4"/>
    <circle class="blip" cx="600" cy="22" r="3" fill="#7CFFB2"/>
  </g>
  <text class="mono" x="548" y="27" fill="#2F5F8C" font-size="11" letter-spacing="2.4">BUS</text>
  <text class="mono" x="622" y="27" fill="#2F5F8C" font-size="11" letter-spacing="2.4">OK</text>

  <!-- corner ticks -->
  <g stroke="#1E4A78" stroke-width="1.4">
    <path d="M0 10 V22"/><path d="M0 34 V22"/>
    <path d="M1200 10 V22"/><path d="M1200 34 V22"/>
  </g>
</svg>
