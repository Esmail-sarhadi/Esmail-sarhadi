<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Repository distribution by language and by technology">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050810"/><stop offset="100%" stop-color="#03050A"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7CFFB2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7CFFB2" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="sweepG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="sgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#0E1D33" stroke-width="1"/>
    </pattern>
    <filter id="sglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
    @keyframes sblink { 0%,46%{opacity:1} 52%,96%{opacity:.18} 100%{opacity:1} }
    @keyframes ssweep { from{transform:translateX(-200px)} to{transform:translateX(1200px)} }
    @keyframes stick  { to { stroke-dashoffset: -240; } }
    .sblink { animation: sblink 2.2s steps(1,end) infinite; }
    .ssweep { animation: ssweep 6.5s linear infinite; }
    .stick  { stroke-dasharray: 6 18; animation: stick 4s linear infinite; }
    @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
  </style>

  <rect width="1200" height="380" fill="url(#sbg)"/>
  <rect width="1200" height="380" fill="url(#sgrid)" opacity="0.4"/>

  <!-- header -->
  <circle class="sblink" cx="40" cy="28" r="4" fill="#7CFFB2" filter="url(#sglow)"/>
  <text class="mono" x="56" y="33" fill="#4E7CA8" font-size="11" letter-spacing="3">FIG.06 // REPOSITORY DISTRIBUTION</text>
  <text class="mono" x="40" y="62" fill="#EAF6FF" font-size="21" font-weight="700" letter-spacing="1.5">WHERE THE WORK ACTUALLY IS</text>
  <text class="mono" x="40" y="84" fill="#3E6E9C" font-size="11" letter-spacing="1">// COUNTED FROM 70 PUBLIC REPOSITORIES — NO SELF-RATING, JUST THE API</text>
  <text class="mono" x="1160" y="33" text-anchor="end" fill="#2F5F8C" font-size="9" letter-spacing="2">SCALE: RELATIVE TO COLUMN MAX</text>
  <line x1="24" y1="98" x2="1176" y2="98" stroke="#14304F" stroke-width="1"/>

  <!-- column headers -->
  <text class="mono" x="60"  y="118" fill="#00E5FF" font-size="11" letter-spacing="2">BY LANGUAGE</text>
  <text class="mono" x="620" y="118" fill="#7CFFB2" font-size="11" letter-spacing="2">BY TECHNOLOGY</text>

  <!-- ============ LEFT COLUMN ============ -->
  <g class="mono" font-size="11.5">
    <!-- HTML 40 -->
    <text x="60" y="150" fill="#8FB6D9">HTML</text>
    <rect x="190" y="136" width="280" height="14" rx="2" fill="#0B1A2C"/>
    <rect x="190" y="136" width="280" height="14" rx="2" fill="url(#barA)"/>
    <text x="540" y="148" text-anchor="end" fill="#EAF6FF">40</text>

    <!-- C++ 12 -->
    <text x="60" y="180" fill="#8FB6D9">C++</text>
    <rect x="190" y="166" width="280" height="14" rx="2" fill="#0B1A2C"/>
    <rect x="190" y="166" width="84" height="14" rx="2" fill="url(#barA)"/>
    <text x="540" y="178" text-anchor="end" fill="#EAF6FF">12</text>

    <!-- Python 8 -->
    <text x="60" y="210" fill="#8FB6D9">Python</text>
    <rect x="190" y="196" width="280" height="14" rx="2" fill="#0B1A2C"/>
    <rect x="190" y="196" width="56" height="14" rx="2" fill="url(#barA)"/>
    <text x="540" y="208" text-anchor="end" fill="#EAF6FF">8</text>

    <!-- Markdown 3 -->
    <text x="60" y="240" fill="#8FB6D9">Markdown</text>
    <rect x="190" y="226" width="280" height="14" rx="2" fill="#0B1A2C"/>
    <rect x="190" y="226" width="21" height="14" rx="2" fill="url(#barA)"/>
    <text x="540" y="238" text-anchor="end" fill="#C9E2F5">3</text>

    <!-- JavaScript 2 -->
    <text x="60" y="270" fill="#8FB6D9">JavaScript</text>
    <rect x="190" y="256" width="280" height="14" rx="2" fill="#0B1A2C"/>
    <rect x="190" y="256" width="14" height="14" rx="2" fill="url(#barA)"/>
    <text x="540" y="268" text-anchor="end" fill="#C9E2F5">2</text>

    <!-- C 2 -->
    <text x="60" y="300" fill="#8FB6D9">C</text>
    <rect x="190" y="286" width="280" height="14" rx="2" fill="#0B1A2C"/>
    <rect x="190" y="286" width="14" height="14" rx="2" fill="url(#barA)"/>
    <text x="540" y="298" text-anchor="end" fill="#C9E2F5">2</text>

    <!-- tail -->
    <text x="60" y="330" fill="#5C89B8">TypeScript · Kotlin · CSS</text>
    <rect x="190" y="316" width="280" height="14" rx="2" fill="#0B1A2C"/>
    <rect x="190" y="316" width="7" height="14" rx="2" fill="url(#barA)"/>
    <text x="540" y="328" text-anchor="end" fill="#8FB6D9">1 each</text>
  </g>

  <!-- ============ RIGHT COLUMN ============ -->
  <g class="mono" font-size="11.5">
    <!-- ESP32 29 -->
    <text x="620" y="150" fill="#8FB6D9">ESP32</text>
    <rect x="750" y="136" width="280" height="14" rx="2" fill="#0B1A2C"/>
    <rect x="750" y="136" width="280" height="14" rx="2" fill="url(#barB)"/>
    <text x="1140" y="148" text-anchor="end" fill="#EAF6FF">29</text>

    <!-- LoRa / RF 7 -->
    <text x="620" y="180" fill="#8FB6D9">LoRa / RF</text>
    <rect x="750" y="166" width="280" height="14" rx="2" fill="#0B1A2C"/>
    <rect x="750" y="166" width="67.6" height="14" rx="2" fill="url(#barB)"/>
    <text x="1140" y="178" text-anchor="end" fill="#EAF6FF">7</text>

    <!-- OTA 5 -->
    <text x="620" y="210" fill="#8FB6D9">OTA updates</text>
    <rect x="750" y="196" width="280" height="14" rx="2" fill="#0B1A2C"/>
    <rect x="750" y="196" width="48.3" height="14" rx="2" fill="url(#barB)"/>
    <text x="1140" y="208" text-anchor="end" fill="#EAF6FF">5</text>

    <!-- NMEA / GPS 4 -->
    <text x="620" y="240" fill="#8FB6D9">NMEA / GPS</text>
    <rect x="750" y="226" width="280" height="14" rx="2" fill="#0B1A2C"/>
    <rect x="750" y="226" width="38.6" height="14" rx="2" fill="url(#barB)"/>
    <text x="1140" y="238" text-anchor="end" fill="#C9E2F5">4</text>

    <!-- MQTT 3 -->
    <text x="620" y="270" fill="#8FB6D9">MQTT</text>
    <rect x="750" y="256" width="280" height="14" rx="2" fill="#0B1A2C"/>
    <rect x="750" y="256" width="29" height="14" rx="2" fill="url(#barB)"/>
    <text x="1140" y="268" text-anchor="end" fill="#C9E2F5">3</text>

    <!-- Flask 3 -->
    <text x="620" y="300" fill="#8FB6D9">Flask</text>
    <rect x="750" y="286" width="280" height="14" rx="2" fill="#0B1A2C"/>
    <rect x="750" y="286" width="29" height="14" rx="2" fill="url(#barB)"/>
    <text x="1140" y="298" text-anchor="end" fill="#C9E2F5">3</text>

    <!-- OpenCV 3 -->
    <text x="620" y="330" fill="#8FB6D9">OpenCV</text>
    <rect x="750" y="316" width="280" height="14" rx="2" fill="#0B1A2C"/>
    <rect x="750" y="316" width="29" height="14" rx="2" fill="url(#barB)"/>
    <text x="1140" y="328" text-anchor="end" fill="#C9E2F5">3</text>
  </g>

  <!-- vertical separators -->
  <line x1="580" y1="124" x2="580" y2="332" stroke="#122544" stroke-width="1"/>

  <!-- scan sweep -->
  <rect class="ssweep" x="0" y="120" width="200" height="220" fill="url(#sweepG)" opacity="0.9"/>

  <!-- baseline ruler -->
  <line x1="60" y1="348" x2="1140" y2="348" stroke="#14304F" stroke-width="1"/>
  <line x1="60" y1="348" x2="1140" y2="348" stroke="#2A6FA8" stroke-width="1" class="stick" opacity="0.5"/>
  <g stroke="#1E4A78" stroke-width="1">
    <path d="M60 342 V354"/><path d="M330 342 V354"/><path d="M600 342 V354"/><path d="M870 342 V354"/><path d="M1140 342 V354"/>
  </g>

  <text class="mono" x="40" y="366" fill="#2F5F8C" font-size="9.5" letter-spacing="1.4">SOURCE: GITHUB REST API /users/Esmail-sarhadi/repos · TECHNOLOGY COLUMN MATCHES REPO NAMES AND DESCRIPTIONS</text>

  <g stroke="#2A6FA8" stroke-width="2" fill="none" opacity="0.85">
    <path d="M16 30 V16 H30"/><path d="M1184 30 V16 H1170"/>
    <path d="M16 350 V364 H30"/><path d="M1184 350 V364 H1170"/>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="2" fill="none" stroke="#122544" stroke-width="2"/>
</svg>
