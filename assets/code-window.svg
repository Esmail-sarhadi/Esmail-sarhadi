  <text class="mono" x="248" y="496.5" fill="#3E6E9C" font-size="9.5" letter-spacing="1.4">Ln 22, Col 58</text>
  <text class="mono" x="372" y="496.5" fill="#3E6E9C" font-size="9.5" letter-spacing="1.4">Spaces: 2</text>
  <text class="mono" x="470" y="496.5" fill="#3E6E9C" font-size="9.5" letter-spacing="1.4">UTF-8</text>

  <text class="mono" x="880" y="496.5" fill="#3E6E9C" font-size="9.5" letter-spacing="1.4">BUILD</text>
  <circle class="cd1" cx="928" cy="493" r="2.2" fill="#7CFFB2"/>
  <circle class="cd2" cx="938" cy="493" r="2.2" fill="#7CFFB2"/>
  <circle class="cd3" cx="948" cy="493" r="2.2" fill="#7CFFB2"/>
  <circle cx="1076" cy="493" r="3" fill="#7CFFB2" filter="url(#cglow)"/>
  <text class="mono" x="1140" y="496.5" text-anchor="end" fill="#7CFFB2" font-size="9.5" letter-spacing="1.6">FLASHED OK</text>

