<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Code window — ESP32 OTA web server firmware in C++">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D18"/><stop offset="100%" stop-color="#04070F"/>
    </linearGradient>
    <linearGradient id="ctitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1A32"/><stop offset="100%" stop-color="#071120"/>
    </linearGradient>
    <linearGradient id="cstatus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#08182A"/><stop offset="100%" stop-color="#050F1B"/>
    </linearGradient>
    <radialGradient id="camb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="cglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: Consolas, Menlo, 'DejaVu Sans Mono', 'Courier New', monospace; }
    @keyframes cblink { 0%,46%{opacity:1} 52%,100%{opacity:0} }
    @keyframes cactive { 0%,100%{opacity:.35} 50%{opacity:.85} }
    @keyframes cdot { 0%,100%{opacity:.2} 50%{opacity:1} }
    .cblink { animation: cblink 1.05s steps(1,end) infinite; }
    .cactive { animation: cactive 3s ease-in-out infinite; }
    .cd1 { animation: cdot 1.2s ease-in-out infinite; }
    .cd2 { animation: cdot 1.2s ease-in-out infinite; animation-delay: .3s; }
    .cd3 { animation: cdot 1.2s ease-in-out infinite; animation-delay: .6s; }
    @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
  </style>

  <rect width="1200" height="520" fill="#03050A"/>
  <ellipse cx="600" cy="260" rx="640" ry="270" fill="url(#camb)"/>

  <!-- window -->
  <rect x="40" y="20" width="1120" height="480" rx="10" fill="url(#cbg)" stroke="#1A4568" stroke-width="1.4"/>
  <path d="M50 20 H1150 A10 10 0 0 1 1160 30 V56 H40 V30 A10 10 0 0 1 50 20 Z" fill="url(#ctitle)"/>
  <line x1="42" y1="56" x2="1158" y2="56" stroke="#14304F" stroke-width="1.2"/>

  <!-- traffic lights -->
  <g stroke="#0A1524" stroke-width="1.4">
    <circle cx="68" cy="38" r="5.5" fill="#FF6B9D" opacity="0.9"/>
    <circle cx="90" cy="38" r="5.5" fill="#7CFFB2" opacity="0.9"/>
    <circle cx="112" cy="38" r="5.5" fill="#00E5FF" opacity="0.9"/>
  </g>

  <!-- tab -->
  <g>
    <path d="M150 20 H330 A0 0 0 0 1 330 20 V56 H150 Z" fill="#0A1729"/>
    <line x1="150" y1="56" x2="330" y2="56" stroke="#00E5FF" stroke-width="1.6"/>
    <circle cx="164" cy="38" r="3.2" fill="#00E5FF" opacity="0.85"/>
    <text class="mono" x="176" y="42" fill="#C9E2F5" font-size="11">ota_web_server.cpp</text>
    <text class="mono" x="316" y="42" text-anchor="end" fill="#3E6E9C" font-size="10">&#9679;</text>
  </g>
  <text class="mono" x="352" y="42" fill="#2F5F8C" font-size="11">wifi_cfg.h</text>
  <text class="mono" x="452" y="42" fill="#2F5F8C" font-size="11">README.md</text>

  <text class="mono" x="600" y="42" text-anchor="middle" fill="#1F4A73" font-size="10.5" letter-spacing="2">ESMAIL-SARHADI / ESP32-OTA-WEB-SERVER</text>
  <text class="mono" x="1136" y="42" text-anchor="end" fill="#2F5F8C" font-size="9.5" letter-spacing="1.5">C++ · ARDUINO</text>

  <!-- active line band -->
  <rect class="cactive" x="104" y="426" width="1046" height="17" fill="#00E5FF" opacity="0.06"/>
  <rect x="104" y="426" width="2" height="17" fill="#00E5FF"/>

  <!-- gutter separator -->
  <line x1="100" y1="62" x2="100" y2="486" stroke="#0E2138" stroke-width="1"/>

  <!-- line numbers -->
  <g class="mono" font-size="11" fill="#22405F" text-anchor="end">
    <text x="92" y="84">1</text><text x="92" y="100.8">2</text><text x="92" y="117.6">3</text>
    <text x="92" y="134.4">4</text><text x="92" y="151.2">5</text><text x="92" y="168">6</text>
    <text x="92" y="184.8">7</text><text x="92" y="201.6">8</text><text x="92" y="218.4">9</text>
    <text x="92" y="235.2">10</text><text x="92" y="252">11</text><text x="92" y="268.8">12</text>
    <text x="92" y="285.6">13</text><text x="92" y="302.4">14</text><text x="92" y="319.2">15</text>
    <text x="92" y="336">16</text><text x="92" y="352.8">17</text><text x="92" y="369.6">18</text>
    <text x="92" y="386.4">19</text><text x="92" y="403.2">20</text><text x="92" y="420">21</text>
    <text x="92" y="436.8" fill="#00E5FF">22</text><text x="92" y="453.6">23</text><text x="92" y="470.4">24</text>
  </g>

  <!-- code -->
  <g class="mono" font-size="12.6">
    <!-- 1 -->
    <text x="116" y="84" fill="#3E6E9C">// ota_web_server.cpp &#8212; ESP32 &#183; Arduino core</text>
    <!-- 2 -->
    <text x="116" y="100.8"><tspan fill="#FF6B9D">#include</tspan><tspan fill="#7CFFB2"> &lt;WiFi.h&gt;</tspan></text>
    <!-- 3 -->
    <text x="116" y="117.6"><tspan fill="#FF6B9D">#include</tspan><tspan fill="#7CFFB2"> &lt;WebServer.h&gt;</tspan></text>
    <!-- 4 -->
    <text x="116" y="134.4"><tspan fill="#FF6B9D">#include</tspan><tspan fill="#7CFFB2"> &lt;Update.h&gt;</tspan></text>
    <!-- 6 -->
    <text x="116" y="168"><tspan fill="#B388FF">static</tspan><tspan fill="#00E5FF"> WebServer</tspan><tspan fill="#C9E2F5"> server</tspan><tspan fill="#8FB6D9">(</tspan><tspan fill="#FFB86C">80</tspan><tspan fill="#8FB6D9">);</tspan></text>
    <!-- 8 -->
    <text x="116" y="201.6"><tspan fill="#B388FF">void</tspan><tspan fill="#EAF6FF"> handleUpload</tspan><tspan fill="#8FB6D9">() {</tspan></text>
    <!-- 9 -->
    <text x="116" y="218.4"><tspan fill="#00E5FF">  HTTPUpload</tspan><tspan fill="#8FB6D9">&amp;</tspan><tspan fill="#C9E2F5"> up</tspan><tspan fill="#8FB6D9"> = </tspan><tspan fill="#C9E2F5">server</tspan><tspan fill="#8FB6D9">.</tspan><tspan fill="#EAF6FF">upload</tspan><tspan fill="#8FB6D9">();</tspan></text>
    <!-- 10 -->
    <text x="116" y="235.2"><tspan fill="#B388FF">  if</tspan><tspan fill="#8FB6D9"> (</tspan><tspan fill="#C9E2F5">up</tspan><tspan fill="#8FB6D9">.</tspan><tspan fill="#C9E2F5">status</tspan><tspan fill="#8FB6D9"> == </tspan><tspan fill="#FFB86C">UPLOAD_FILE_WRITE</tspan><tspan fill="#8FB6D9">) {</tspan></text>
    <!-- 11 -->
    <text x="116" y="252"><tspan fill="#B388FF">    if</tspan><tspan fill="#8FB6D9"> (</tspan><tspan fill="#00E5FF">Update</tspan><tspan fill="#8FB6D9">.</tspan><tspan fill="#EAF6FF">write</tspan><tspan fill="#8FB6D9">(</tspan><tspan fill="#C9E2F5">up</tspan><tspan fill="#8FB6D9">.</tspan><tspan fill="#C9E2F5">buf</tspan><tspan fill="#8FB6D9">, </tspan><tspan fill="#C9E2F5">up</tspan><tspan fill="#8FB6D9">.</tspan><tspan fill="#C9E2F5">currentSize</tspan><tspan fill="#8FB6D9">) != </tspan><tspan fill="#C9E2F5">up</tspan><tspan fill="#8FB6D9">.</tspan><tspan fill="#C9E2F5">currentSize</tspan><tspan fill="#8FB6D9">) {</tspan></text>
    <!-- 12 -->
    <text x="116" y="268.8"><tspan fill="#C9E2F5">      server</tspan><tspan fill="#8FB6D9">.</tspan><tspan fill="#EAF6FF">send</tspan><tspan fill="#8FB6D9">(</tspan><tspan fill="#FFB86C">400</tspan><tspan fill="#8FB6D9">, </tspan><tspan fill="#7CFFB2">"text/plain"</tspan><tspan fill="#8FB6D9">, </tspan><tspan fill="#7CFFB2">"flash write failed"</tspan><tspan fill="#8FB6D9">);</tspan></text>
    <!-- 13 -->
    <text x="116" y="285.6"><tspan fill="#B388FF">      return</tspan><tspan fill="#8FB6D9">;</tspan></text>
    <!-- 14 -->
    <text x="116" y="302.4" fill="#8FB6D9">    }</text>
    <!-- 15 -->
    <text x="116" y="319.2" fill="#8FB6D9">  }</text>
    <!-- 16 -->
    <text x="116" y="336" fill="#8FB6D9">}</text>
    <!-- 18 -->
    <text x="116" y="369.6"><tspan fill="#B388FF">void</tspan><tspan fill="#EAF6FF"> setup</tspan><tspan fill="#8FB6D9">() {</tspan></text>
    <!-- 19 -->
    <text x="116" y="386.4"><tspan fill="#00E5FF">  Serial</tspan><tspan fill="#8FB6D9">.</tspan><tspan fill="#EAF6FF">begin</tspan><tspan fill="#8FB6D9">(</tspan><tspan fill="#FFB86C">115200</tspan><tspan fill="#8FB6D9">);</tspan></text>
    <!-- 20 -->
    <text x="116" y="403.2"><tspan fill="#00E5FF">  WiFi</tspan><tspan fill="#8FB6D9">.</tspan><tspan fill="#EAF6FF">begin</tspan><tspan fill="#8FB6D9">(</tspan><tspan fill="#FFB86C">WIFI_SSID</tspan><tspan fill="#8FB6D9">, </tspan><tspan fill="#FFB86C">WIFI_PASS</tspan><tspan fill="#8FB6D9">);</tspan></text>
    <!-- 21 -->
    <text x="116" y="420"><tspan fill="#B388FF">  while</tspan><tspan fill="#8FB6D9"> (</tspan><tspan fill="#00E5FF">WiFi</tspan><tspan fill="#8FB6D9">.</tspan><tspan fill="#EAF6FF">status</tspan><tspan fill="#8FB6D9">() != </tspan><tspan fill="#FFB86C">WL_CONNECTED</tspan><tspan fill="#8FB6D9">) </tspan><tspan fill="#EAF6FF">delay</tspan><tspan fill="#8FB6D9">(</tspan><tspan fill="#FFB86C">250</tspan><tspan fill="#8FB6D9">);</tspan></text>
    <!-- 22 -->
    <text x="116" y="436.8"><tspan fill="#C9E2F5">  server</tspan><tspan fill="#8FB6D9">.</tspan><tspan fill="#EAF6FF">on</tspan><tspan fill="#8FB6D9">(</tspan><tspan fill="#7CFFB2">"/update"</tspan><tspan fill="#8FB6D9">, </tspan><tspan fill="#FFB86C">HTTP_POST</tspan><tspan fill="#8FB6D9">, </tspan><tspan fill="#EAF6FF">handleUpdate</tspan><tspan fill="#8FB6D9">, </tspan><tspan fill="#EAF6FF">handleUpload</tspan><tspan fill="#8FB6D9">);</tspan></text>
    <!-- 23 -->
    <text x="116" y="453.6"><tspan fill="#C9E2F5">  server</tspan><tspan fill="#8FB6D9">.</tspan><tspan fill="#EAF6FF">begin</tspan><tspan fill="#8FB6D9">();</tspan></text>
    <!-- 24 -->
    <text x="116" y="470.4" fill="#8FB6D9">}</text>
  </g>

  <!-- caret -->
  <rect class="cblink" x="132" y="460" width="7" height="14" fill="#7CFFB2"/>

