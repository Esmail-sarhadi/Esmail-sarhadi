  <text class="mono" x="600" y="55" text-anchor="middle" fill="#3E6E9C" font-size="12.5" letter-spacing="2.5">esmail@zahedan: ~/profile</text>
  <text class="mono" x="1136" y="55" text-anchor="end" fill="#2F5F8C" font-size="9.5" letter-spacing="1.5">UTF-8 · LF</text>

  <!-- body -->
  <g class="mono" font-size="15">
    <text x="88" y="106"><tspan fill="#00E5FF">esmail@zahedan</tspan><tspan fill="#3E6E9C">:~$</tspan><tspan fill="#EAF6FF"> cat profile.yaml</tspan></text>

    <text x="88" y="129" fill="#2F5F8C"># core</text>
    <text x="88" y="152" fill="#7FB2DC">name:</text><text x="216" y="152" fill="#EAF6FF" font-weight="700">Esmail Sarhadi</text>
    <text x="88" y="175" fill="#7FB2DC">role:</text><text x="216" y="175" fill="#C9E2F5">Embedded Systems Engineer · Industrial IoT</text>
    <text x="88" y="198" fill="#7FB2DC">base:</text><text x="216" y="198" fill="#C9E2F5">Zahedan, Iran (UTC+3:30)</text>
    <text x="88" y="221" fill="#7FB2DC">since:</text><text x="216" y="221" fill="#C9E2F5">2018 — 76 public repositories</text>

    <text x="88" y="244" fill="#2F5F8C"># stack</text>
    <text x="88" y="267" fill="#7FB2DC">languages:</text><text x="216" y="267" fill="#C9E2F5">C · C++ · Python · JavaScript</text>
    <text x="88" y="290" fill="#7FB2DC">silicon:</text><text x="216" y="290" fill="#C9E2F5">ESP32 · STM32 · Arduino</text>
    <text x="88" y="313" fill="#7FB2DC">field bus:</text><text x="216" y="313" fill="#C9E2F5">Modbus RTU/TCP · RS-485</text>
    <text x="88" y="336" fill="#7FB2DC">wireless:</text><text x="216" y="336" fill="#C9E2F5">Wi-Fi · Bluetooth · LoRa (RFM95) · UHF</text>

    <text x="88" y="359" fill="#2F5F8C"># uplink</text>
    <text x="88" y="382" fill="#7FB2DC">telemetry:</text><text x="216" y="382" fill="#C9E2F5">MQTT · HTTP/REST · WebSocket · SNMP v2 · IEC 60870-5-104</text>
    <text x="88" y="405" fill="#7FB2DC">software:</text><text x="216" y="405" fill="#C9E2F5">Flask · React · Next.js · Android · SQL</text>
    <text x="88" y="428" fill="#7FB2DC">status:</text><text x="216" y="428" fill="#7CFFB2">[ OPEN ] — available for embedded &amp; industrial IoT work</text>

    <text x="88" y="451"><tspan fill="#00E5FF">esmail@zahedan</tspan><tspan fill="#3E6E9C">:~$</tspan></text>
    <rect class="cur" x="248" y="438" width="9" height="15" fill="#7CFFB2"/>
  </g>

  <!-- CRT scanline -->
  <rect class="scan" x="42" y="78" width="1116" height="2.5" fill="#00E5FF" opacity="0.05"/>

  <!-- status bar -->
  <line x1="42" y1="466" x2="1158" y2="466" stroke="#14304F" stroke-width="1.2"/>
  <text class="mono" x="60" y="487" fill="#2F5F8C" font-size="10" letter-spacing="1.5">bash · profile.yaml · 16 lines</text>
  <circle class="cur" cx="1076" cy="483" r="3" fill="#7CFFB2" filter="url(#tglow)"/>
  <text class="mono" x="1140" y="487" text-anchor="end" fill="#7CFFB2" font-size="10" letter-spacing="2">EXIT 0</text>

  <!-- HUD corners -->
  <g stroke="#2A6FA8" stroke-width="2" fill="none" opacity="0.85">
    <path d="M16 30 V16 H30"/><path d="M1170 30 V16 H1186"/>
    <path d="M16 510 V524 H30"/><path d="M1170 510 V524 H1186"/>
  </g>
  <rect x="1" y="1" width="1198" height="538" rx="2" fill="none" stroke="#122544" stroke-width="2"/>
