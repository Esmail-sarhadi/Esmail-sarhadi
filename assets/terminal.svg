<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Terminal — profile.yaml of Esmail Sarhadi">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D18"/>
      <stop offset="100%" stop-color="#04070F"/>
    </linearGradient>
    <linearGradient id="tbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1A32"/>
      <stop offset="100%" stop-color="#071120"/>
    </linearGradient>
    <radialGradient id="tamb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tdots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1B3358" opacity="0.4"/>
    </pattern>
    <filter id="tglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: Consolas, Menlo, 'DejaVu Sans Mono', 'Courier New', monospace; }
    @keyframes tblink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes tscan  { from{transform:translateY(0)} to{transform:translateY(386px)} }
    .cur  { animation: tblink 1.1s steps(1,end) infinite; }
    .scan { animation: tscan 7s linear infinite; }
    @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
  </style>

  <rect width="1200" height="540" fill="#03050A"/>
  <rect width="1200" height="540" fill="url(#tdots)" opacity="0.35"/>
  <ellipse cx="600" cy="264" rx="640" ry="290" fill="url(#tamb)"/>

  <!-- window -->
  <rect x="40" y="28" width="1120" height="472" rx="10" fill="url(#tbg)" stroke="#1A4568" stroke-width="1.4"/>
  <path d="M50 28 H1150 A10 10 0 0 1 1160 38 V72 H40 V38 A10 10 0 0 1 50 28 Z" fill="url(#tbar)"/>
  <line x1="42" y1="72" x2="1158" y2="72" stroke="#14304F" stroke-width="1.2"/>

  <!-- traffic lights -->
  <g stroke="#0A1524" stroke-width="1.4">
    <circle cx="68"  cy="50" r="5.5" fill="#FF6B9D" opacity="0.9"/>
    <circle cx="90"  cy="50" r="5.5" fill="#7CFFB2" opacity="0.9"/>
    <circle cx="112" cy="50" r="5.5" fill="#00E5FF" opacity="0.9"/>
