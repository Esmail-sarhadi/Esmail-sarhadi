<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="System topology — field nodes, ESP32 gateway, broker and dashboard">
  <defs>
    <linearGradient id="nbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050810"/><stop offset="100%" stop-color="#03050A"/>
    </linearGradient>
    <linearGradient id="nedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7CFFB2" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="nglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ngrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#0E1D33" stroke-width="1"/>
    </pattern>
    <filter id="nglowf" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
    @keyframes nblink { 0%,45%{opacity:1} 55%,95%{opacity:.15} 100%{opacity:1} }
    @keyframes nflow { to { stroke-dashoffset: -480; } }
    @keyframes npul  { 0%,100%{opacity:.45} 50%{opacity:1} }
    @keyframes nring { 0%{opacity:.55; } 100%{opacity:0; } }
    .nblink { animation: nblink 2.1s steps(1,end) infinite; }
    .nflow { stroke-dasharray: 9 22; animation: nflow 3.6s linear infinite; }
    .npul { animation: npul 3s ease-in-out infinite; }
    @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
  </style>

  <rect width="1200" height="460" fill="url(#nbg)"/>
  <rect width="1200" height="460" fill="url(#ngrid)" opacity="0.4"/>
  <ellipse cx="600" cy="230" rx="430" ry="210" fill="url(#nglow)"/>

  <!-- header -->
  <circle class="nblink" cx="34" cy="28" r="4" fill="#7CFFB2" filter="url(#nglowf)"/>
  <text class="mono" x="50" y="33" fill="#4E7CA8" font-size="11" letter-spacing="3">FIG.09 // SYSTEM TOPOLOGY</text>
  <text class="mono" x="34" y="0" fill="#000" font-size="1">.</text>
  <text class="mono" x="1166" y="33" text-anchor="end" fill="#2F5F8C" font-size="9" letter-spacing="2">FIELD &#8594; EDGE &#8594; CLOUD &#8594; OPERATOR</text>

  <!-- ===== EDGES ===== -->
  <g stroke="#14304F" stroke-width="1.6" fill="none">
    <path d="M250 110 L520 205"/>
    <path d="M250 348 L520 255"/>
    <path d="M600 94 V182"/>
    <path d="M600 368 V278"/>
    <path d="M680 205 L950 110"/>
    <path d="M680 255 L950 348"/>
  </g>
  <g stroke="url(#nedge)" stroke-width="1.6" fill="none" class="nflow">
    <path d="M250 110 L520 205"/>
    <path d="M250 348 L520 255"/>
    <path d="M600 94 V182"/>
    <path d="M600 368 V278"/>
    <path d="M680 205 L950 110"/>
    <path d="M680 255 L950 348"/>
  </g>

  <!-- packets -->
  <g filter="url(#nglowf)">
    <circle r="3.2" fill="#7CFFB2">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M250 110 L520 205"/>
    </circle>
    <circle r="3.2" fill="#00E5FF">
      <animateMotion dur="3.8s" begin="0.6s" repeatCount="indefinite" path="M250 348 L520 255"/>
    </circle>
    <circle r="3" fill="#FFB86C">
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M600 94 V182"/>
    </circle>
    <circle r="3" fill="#B388FF">
      <animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite" path="M600 368 V278"/>
    </circle>
    <circle r="3.2" fill="#7CFFB2">
      <animateMotion dur="3.2s" begin="0.9s" repeatCount="indefinite" path="M680 205 L950 110"/>
    </circle>
    <circle r="3.2" fill="#00E5FF">
      <animateMotion dur="3.8s" begin="1.3s" repeatCount="indefinite" path="M680 255 L950 348"/>
    </circle>
  </g>

  <!-- edge labels -->
  <g class="mono" font-size="9.5" letter-spacing="1.4" fill="#2F5F8C">
    <text x="368" y="146">LoRa 868 MHz</text>
    <text x="368" y="322">I2C / SPI / 1-Wire</text>
    <text x="612" y="140">Modbus RTU &#183; RS-485</text>
    <text x="612" y="336">SNMP v2</text>
    <text x="700" y="146">MQTT / TLS</text>
    <text x="700" y="322">REST &#183; WebSocket</text>
  </g>

  <!-- ===== NODE: LoRa field node ===== -->
  <g>
    <rect x="100" y="63" width="150" height="64" rx="6" fill="#07182B" stroke="#1E4A78" stroke-width="1.3"/>
    <text class="mono" x="118" y="88" fill="#EAF6FF" font-size="12.5" letter-spacing="1">LoRa NODE</text>
    <text class="mono" x="118" y="106" fill="#4E7CA8" font-size="9.5">RFM95 &#183; DHT22 &#183; battery</text>
    <line x1="242" y1="95" x2="250" y2="110" stroke="#1E4A78" stroke-width="1.4"/>
    <path d="M232 82 l10 13 -10 13" fill="none" stroke="#2A6FA8" stroke-width="1.4"/>
    <circle cx="232" cy="82" r="2.6" fill="#00E5FF" filter="url(#nglowf)"/>
  </g>

  <!-- ===== NODE: sensor station ===== -->
  <g>
    <rect x="100" y="333" width="150" height="64" rx="6" fill="#07182B" stroke="#1E4A78" stroke-width="1.3"/>
    <text class="mono" x="118" y="358" fill="#EAF6FF" font-size="12.5" letter-spacing="1">SENSOR STATION</text>
    <text class="mono" x="118" y="376" fill="#4E7CA8" font-size="9.5">DHT21 &#183; MQ135 &#183; pulse</text>
    <path d="M242 365 l8 -13 -8 -13" fill="none" stroke="#2A6FA8" stroke-width="1.4"/>
  </g>

  <!-- ===== NODE: VFD ===== -->
  <g>
    <rect x="525" y="30" width="150" height="64" rx="6" fill="#07182B" stroke="#22496E" stroke-width="1.3"/>
    <text class="mono" x="543" y="55" fill="#EAF6FF" font-size="12.5" letter-spacing="1">VFD · 7.5 kW</text>
    <text class="mono" x="543" y="73" fill="#4E7CA8" font-size="9.5">Shihlin SH040 &#183; RS-485</text>
    <circle cx="666" cy="46" r="3" fill="#FFB86C" filter="url(#nglowf)"/>
  </g>

  <!-- ===== NODE: SNMP manager ===== -->
  <g>
    <rect x="525" y="368" width="150" height="64" rx="6" fill="#07182B" stroke="#22496E" stroke-width="1.3"/>
    <text class="mono" x="543" y="393" fill="#EAF6FF" font-size="12.5" letter-spacing="1">SNMP MANAGER</text>
    <text class="mono" x="543" y="411" fill="#4E7CA8" font-size="9.5">NMS &#183; polling agent</text>
    <circle cx="666" cy="386" r="3" fill="#B388FF" filter="url(#nglowf)"/>
  </g>

  <!-- ===== NODE: MQTT broker ===== -->
  <g>
    <rect x="950" y="63" width="150" height="64" rx="6" fill="#08182A" stroke="#2A6FA8" stroke-width="1.3"/>
    <text class="mono" x="968" y="88" fill="#EAF6FF" font-size="12.5" letter-spacing="1">MQTT BROKER</text>
    <text class="mono" x="968" y="106" fill="#4E7CA8" font-size="9.5">pub / sub &#183; retained</text>
    <circle class="nblink" cx="1088" cy="76" r="3" fill="#7CFFB2" filter="url(#nglowf)"/>
  </g>

  <!-- ===== NODE: dashboard ===== -->
  <g>
    <rect x="950" y="333" width="150" height="64" rx="6" fill="#08182A" stroke="#2A6FA8" stroke-width="1.3"/>
    <text class="mono" x="968" y="358" fill="#EAF6FF" font-size="12.5" letter-spacing="1">DASHBOARD</text>
    <text class="mono" x="968" y="376" fill="#4E7CA8" font-size="9.5">Flask &#183; React &#183; SQL</text>
    <path d="M974 392 l8 -12 8 7 10 -18 10 12 14 -20" fill="none" stroke="#7CFFB2" stroke-width="1.3"/>
  </g>

  <!-- ===== CENTRAL GATEWAY ===== -->
  <g>
    <circle class="npul" cx="600" cy="230" r="112" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.3" stroke-dasharray="3 9"/>
    <rect x="520" y="182" width="160" height="96" rx="8" fill="#08182A" stroke="#2A6FA8" stroke-width="1.7"/>
    <rect x="530" y="192" width="140" height="76" rx="5" fill="none" stroke="#14304F" stroke-width="1"/>
    <!-- chip mark -->
    <circle cx="600" cy="216" r="13" fill="#050F1B" stroke="#00E5FF" stroke-width="1.4"/>
    <circle class="nblink" cx="600" cy="216" r="4" fill="#00E5FF" filter="url(#nglowf)"/>
    <g stroke="#1E5C8C" stroke-width="1.1">
      <path d="M573 206 H587 M573 226 H587 M613 206 H627 M613 226 H627"/>
    </g>
    <text class="mono" x="600" y="246" text-anchor="middle" fill="#EAF6FF" font-size="13" letter-spacing="1.4">ESP32 GATEWAY</text>
    <text class="mono" x="600" y="262" text-anchor="middle" fill="#4E7CA8" font-size="9.5">LoRa &#183; RS-485 &#183; Wi-Fi &#183; OTA</text>
  </g>

  <!-- legend -->
  <g transform="translate(34,412)">
    <text class="mono" x="0" y="12" fill="#2F5F8C" font-size="9.5" letter-spacing="1.4">SOLID LINKS = DEPLOYED PATHS &#183; DOTS = LIVE PACKET FLOW &#183; ALL FIRMWARE OTA-UPDATABLE</text>
  </g>

  <g stroke="#2A6FA8" stroke-width="2" fill="none" opacity="0.85">
    <path d="M16 30 V16 H30"/><path d="M1184 30 V16 H1170"/>
    <path d="M16 430 V444 H30"/><path d="M1184 430 V444 H1170"/>
  </g>
  <rect x="1" y="1" width="1198" height="458" rx="2" fill="none" stroke="#122544" stroke-width="2"/>
</svg>
